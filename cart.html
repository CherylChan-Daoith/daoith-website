<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="道一跨境咨询购物车与优惠报价">
  <title>购物车 — 道一跨境咨询 DAOITH</title>
  <link rel="icon" href="/images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=20260727w">
</head>
<body class="article-page cart-page">

  <header class="header header-scrolled" id="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <img src="/images/logo.png" alt="DAOITH Logo">
        <span class="logo-text">道一跨境咨询</span>
      </a>
      <nav class="nav">
        <a href="/">首页</a>
        <a href="/#services">财税服务</a>
        <a href="/cart.html" class="active">购物车</a>
        <a href="/#hub">服务管理</a>
      </nav>
      <div class="lang-switcher" role="group" aria-label="Language">
        <button type="button" class="lang-btn active" data-lang="zh" aria-pressed="true">中文</button>
        <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="auth-slot" id="authSlot"></div>
      <a href="/cart.html" class="cart-link" aria-label="购物车" data-i18n-aria="nav.cart">
        <svg class="cart-link-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span class="cart-badge" data-cart-badge hidden>0</span>
      </a>
    </div>
  </header>

  <main class="article-main">
    <div class="container cart-container">
      <h1 class="cart-page-title" id="cartPageTitle">购物车</h1>
      <p class="cart-page-sub" id="cartPageSub">查看已选服务与预计总价，提交信息获取优惠报价</p>

      <div id="cartEmpty" class="cart-empty is-hidden">
        <h2 id="cartEmptyTitle">购物车是空的</h2>
        <p id="cartEmptyDesc">去财税服务市场挑选适合您的合规服务吧。</p>
        <a href="/#services" class="btn btn-primary btn-sm" id="cartEmptyCta">浏览服务市场</a>
      </div>

      <div id="cartContent" class="cart-content is-hidden">
        <div class="cart-table-wrap">
          <table class="cart-table" aria-label="购物车列表">
            <thead>
              <tr>
                <th id="thService">服务</th>
                <th id="thPrice">单价</th>
                <th id="thQty">数量</th>
                <th id="thSubtotal">小计</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="cartTableBody"></tbody>
          </table>
        </div>

        <div class="cart-summary">
          <div class="cart-total-block">
            <span class="cart-total-label" id="cartTotalLabel">预计服务总价</span>
            <strong class="cart-total-value" id="cartTotalValue">¥0</strong>
          </div>
          <button type="button" class="btn btn-primary" id="openQuoteBtn">获取优惠报价</button>
        </div>
      </div>
    </div>
  </main>

  <div class="quote-modal" id="quoteModal" hidden>
    <div class="quote-modal-backdrop" data-close-quote></div>
    <div class="quote-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="quoteModalTitle">
      <button type="button" class="quote-modal-close" data-close-quote aria-label="关闭">&times;</button>
      <h2 id="quoteModalTitle">获取优惠报价</h2>
      <p class="quote-modal-lead" id="quoteModalLead">留下联系方式，顾问将根据您选购的服务出具优惠方案。</p>
      <form id="quoteForm" class="quote-form" novalidate>
        <div class="form-group">
          <label for="quoteCompany" id="labelCompany">公司名字</label>
          <input type="text" id="quoteCompany" name="company" required autocomplete="organization">
        </div>
        <div class="form-group">
          <label for="quoteContact" id="labelContact">联系人</label>
          <input type="text" id="quoteContact" name="contact" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="quotePhone" id="labelPhone">联系电话</label>
          <input type="tel" id="quotePhone" name="phone" required autocomplete="tel">
        </div>
        <p class="quote-form-error" id="quoteFormError" hidden></p>
        <div class="quote-form-actions">
          <button type="button" class="btn btn-outline btn-sm" data-close-quote id="quoteCancelBtn">取消</button>
          <button type="submit" class="btn btn-primary btn-sm" id="quoteSubmitBtn">提交询价</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer footer-compact">
    <div class="container footer-bottom">
      <span>© 2026 道一跨境咨询 DAOITH Consulting</span>
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">粤ICP备2026024975号-2</a>
      <a href="/#services">服务市场</a>
    </div>
  </footer>

  <script src="/js/locales/en.js?v=20260727w"></script>
  <script src="/js/i18n.js?v=20260727n"></script>
  <script src="/js/config.js?v=20260727x"></script>
  <script src="/js/services.js?v=20260727i"></script>
  <script src="/js/cart.js?v=20260727i"></script>
  <script src="/js/cart-page.js?v=20260727i"></script>
  <script src="/js/auth.js?v=20260727w"></script>
</body>
</html>
