# api.daoith.com — Dify reverse proxy (Docker nginx conf.d)
# Each public prefix injects a different Dify app API key. Do not share keys.
#
# Live mapping:
#   /v1/diagnosis/* → 「道一财税诊断助手」(AI 解决方案页左侧)
#   /v1/cs/*        → 「道一智能客服」(全站右下角，新建独立 Agent)
#   /v1/chatbot/*   → 旧「道一聊天机器人」(已不再被官网使用，可保留)
#   /v1/*           → 「道一合规方案助手」(方案 / HS / 税负)
# Do NOT compare官网咨询 against an unrelated Workflow preview.
#
# IMPORTANT: put real Bearer keys only on the server copy of this file
# (usually under Dify nginx conf.d). Do not commit production keys.

server {
    listen 80;
    server_name api.daoith.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.daoith.com;

    ssl_certificate     /etc/letsencrypt/live/api.daoith.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.daoith.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Step-by-step tax diagnosis Agent
    # Public URL: https://api.daoith.com/v1/diagnosis/chat-messages
    # Rewrites to Dify: /v1/chat-messages  + Authorization: Bearer <diagnosis-app-key>
    # Note: do not use `if ($request_method = OPTIONS)` here — a truncated
    # rewrite previously left proxy_pass inside `if` and broke nginx -t.
    # CORS is handled via proxy_hide_header + add_header ... always (same as chatbot).
    location /v1/diagnosis/ {
        rewrite ^/v1/diagnosis/(.*)$ /v1/$1 break;
        proxy_pass http://api:5001;
        proxy_http_version 1.1;
        proxy_set_header Host api.daoith.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Set on server only — replace with your diagnosis Agent app key:
        # proxy_set_header Authorization "Bearer app-YOUR_DIAGNOSIS_AGENT_KEY";
        proxy_buffering off;
        proxy_read_timeout 3600s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;
    }

    # Site-wide CS Agent — independent from diagnosis
    # Public URL: https://api.daoith.com/v1/cs/chat-messages
    location /v1/cs/ {
        rewrite ^/v1/cs/(.*)$ /v1/$1 break;
        proxy_pass http://api:5001;
        proxy_http_version 1.1;
        proxy_set_header Host api.daoith.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Set on server only — replace with your CS Agent app key:
        # proxy_set_header Authorization "Bearer app-YOUR_CS_AGENT_KEY";
        proxy_buffering off;
        proxy_read_timeout 3600s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;
    }

    # Legacy chatbot Chatflow (unused by current site)
    location /v1/chatbot/ {
        rewrite ^/v1/chatbot/(.*)$ /v1/$1 break;
        proxy_pass http://api:5001;
        proxy_http_version 1.1;
        proxy_set_header Host api.daoith.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Set on server only — do not commit production keys
        # proxy_set_header Authorization "Bearer app-YOUR_CHATFLOW_KEY";
        proxy_buffering off;
        proxy_read_timeout 3600s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;
    }

    # Plan generation / HS / tax (original app)
    location /v1/ {
        proxy_pass http://api:5001/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host api.daoith.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # proxy_set_header Authorization "Bearer app-YOUR_PLAN_KEY";
        proxy_buffering off;
        proxy_read_timeout 3600s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;
    }

    location /api/ {
        proxy_pass http://172.18.0.1:8787;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        add_header Access-Control-Allow-Origin "https://www.daoith.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    location / {
        default_type text/plain;
        return 200 'daoith api ok\n';
    }
}
