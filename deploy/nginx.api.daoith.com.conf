# api.daoith.com — Dify reverse proxy (Docker nginx conf.d)
# Chatbot uses /v1/chatbot/* with a separate Chatflow API key.
# Plan generation keeps /v1/* with the original app key.

server {
    listen 80;
    server_name api.daoith.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.daoith.com;

    ssl_certificate     /etc/letsencrypt/live/api.daoith.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.daoith.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Floating chatbot Chatflow
    location /v1/chatbot/ {
        rewrite ^/v1/chatbot/(.*)$ /v1/$1 break;
        proxy_pass http://api:5001;
        proxy_http_version 1.1;
        proxy_set_header Host api.daoith.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Set on server only — do not commit production keys
        # proxy_set_header Authorization "Bearer app-YOUR_CHATFLOW_KEY";
        proxy_buffering off;
        proxy_read_timeout 3600s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;
    }

    # Plan generation / HS / tax (original app)
    location /v1/ {
        proxy_pass http://api:5001/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host api.daoith.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # proxy_set_header Authorization "Bearer app-YOUR_PLAN_KEY";
        proxy_buffering off;
        proxy_read_timeout 3600s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;
    }

    location /api/ {
        proxy_pass http://172.18.0.1:8787;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        add_header Access-Control-Allow-Origin "https://www.daoith.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    location / {
        default_type text/plain;
        return 200 'daoith api ok\n';
    }
}
